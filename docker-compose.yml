services:
  postgres:
    image: postgres:16
    container_name: curalink-edu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: curalink
      POSTGRES_PASSWORD: curalink
      POSTGRES_DB: curalink_edu
    ports:
      - "5432:5432"
    volumes:
      - curalink_edu_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: curalink-edu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  curalink_edu_pgdata: