<div class="cl-admin-nav">
    <a href="/admin/home" class="cl-admin-nav-link {% if active_page == 'home' %}cl-admin-nav-link-active{% endif %}">
        <span class="material-symbols-outlined cl-icon-sm">home</span> خانه
    </a>
    <a href="/admin/dashboard" class="cl-admin-nav-link {% if active_page == 'dashboard' %}cl-admin-nav-link-active{% endif %}">
        <span class="material-symbols-outlined cl-icon-sm">monitoring</span> داشبورد
    </a>
    {% if is_full_admin %}
    <a href="/admin/panel" class="cl-admin-nav-link {% if active_page == 'content' %}cl-admin-nav-link-active{% endif %}">
        <span class="material-symbols-outlined cl-icon-sm">auto_stories</span> سازنده‌ی محتوا
    </a>
    <a href="/admin/hospital-approvals" class="cl-admin-nav-link {% if active_page == 'hospital_approvals' %}cl-admin-nav-link-active{% endif %}">
        <span class="material-symbols-outlined cl-icon-sm">verified</span> تایید بیمارستان‌ها
    </a>
    {% endif %}
    <a href="/admin/patients" class="cl-admin-nav-link {% if active_page == 'patients' %}cl-admin-nav-link-active{% endif %}">
        <span class="material-symbols-outlined cl-icon-sm">groups</span> گزارش بیماران
    </a>
    <a href="/admin/referrals" class="cl-admin-nav-link {% if active_page == 'referrals' %}cl-admin-nav-link-active{% endif %}">
        <span class="material-symbols-outlined cl-icon-sm">move_to_inbox</span> ارجاعات بیمارستان
    </a>
    <a href="/admin/qr-codes" class="cl-admin-nav-link {% if active_page == 'qr_codes' %}cl-admin-nav-link-active{% endif %}">
        <span class="material-symbols-outlined cl-icon-sm">qr_code_2</span> کدهای QR
    </a>
    <button id="admin-logout-btn" class="cl-admin-nav-link cl-admin-nav-logout">
        <span class="material-symbols-outlined cl-icon-sm">logout</span> خروج
    </button>
</div>

<script>
document.getElementById("admin-logout-btn").addEventListener("click", async function () {
    try {
        await fetch("/admin/auth/logout", { method: "POST", credentials: "same-origin" });
    } finally {
        window.location.href = "/admin/login";
    }
});
</script>
