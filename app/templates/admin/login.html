{% extends "base.html" %}
{% block title %}ورود ادمین | CuraLink{% endblock %}
{% block content %}
<div class="cl-container">
    <div class="cl-card" style="max-width:420px;">
        <h1>ورود پنل مدیریت</h1>
        <p class="cl-sub">با ایمیل و رمز عبور ادمین وارد شوید.</p>

        <div class="cl-field">
            <label for="email">ایمیل</label>
            <input type="email" id="email" placeholder="admin@example.com">
        </div>

        <div class="cl-field">
            <label for="password">رمز عبور</label>
            <input type="password" id="password">
        </div>

        <p id="login-error" style="color:var(--warn); font-size:13.5px; display:none;"></p>

        <button id="login-btn" class="cl-btn">ورود</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
    const btn = document.getElementById("login-btn");
    const errorEl = document.getElementById("login-error");

    btn.addEventListener("click", async function () {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        errorEl.style.display = "none";

        try {
            const res = await fetch("/admin/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password }),
            });
            const data = await res.json();

            if (!res.ok) {
                errorEl.textContent = data.detail || "ورود ناموفق بود.";
                errorEl.style.display = "block";
                return;
            }

            localStorage.setItem("curalink_admin_token", data.access_token);
            window.location.href = "/admin/panel";
        } catch (err) {
            errorEl.textContent = "ارتباط با سرور برقرار نشد.";
            errorEl.style.display = "block";
        }
    });
})();
</script>
{% endblock %}
