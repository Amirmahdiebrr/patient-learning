{% extends "base.html" %}
{% block title %}ورود با QR | CuraLink{% endblock %}
{% block content %}
<div class="cl-scan-required">
    <div>
        <div class="cl-scan-icon">📱</div>
        <h1 style="color:var(--navy); font-size:22px;">برای ورود، QR بیمارستان را اسکن کنید</h1>
        <p style="color:#8CA0B3; max-width:420px; margin:14px auto 0; line-height:2;">
            این پلتفرم فقط از طریق QR Code نصب‌شده در بخش بیمارستان قابل دسترسی است.
            لطفاً به بخش مراجعه کرده و کد QR روی تابلوی ورودی را اسکن کنید.
        </p>
    </div>
</div>
{% endblock %}
