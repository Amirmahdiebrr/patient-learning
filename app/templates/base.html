{# app/templates/base.html #}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CuraLink | آموزش بیمار{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>

    <header class="cl-navbar">
        <div class="cl-navbar-inner">
            <a href="/" class="cl-logo">
                <span class="cl-logo-icon"><span class="material-symbols-outlined">favorite</span></span>
                CuraLink <small>آموزش بیمار</small>
            </a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/admin_modal.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
