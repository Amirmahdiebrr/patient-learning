{# app/templates/base.html #}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CuraLink | آموزش بیمار{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    <a href="#cl-main-content" class="cl-skip-link">رفتن به محتوای اصلی</a>

    {% block header %}
    <header class="cl-navbar">
        <div class="cl-navbar-inner">
            <a href="/" class="cl-logo">
                <img src="/static/img/logo.png" alt="CuraLink" style="width:34px; height:34px; border-radius:12px; margin-inline-end:8px;">
                CuraLink <small>آموزش بیمار</small>
            </a>
            {% block navbar_extra %}{% endblock %}
        </div>
    </header>
    {% endblock %}

    <main id="cl-main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/admin_modal.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
